        <h2 class="text-2xl font-bold">Receber Dois Números e Dizer qual é o Maior</h2>
        <div class="bg-gray-200 p-2"> <input type="number" id="num1" placeholder="Digite o primeiro número"></div>
        <div class="bg-gray-200 p-2"> <input type="number" id="num2" placeholder="Digite o segundo número"></div>
        <button class="bg-blue-500 text-white p-2 rounded" id="verificar">Verificar Maior</button>
        <div class="bg-gray-200 p-2" id="resultadoMaior"></div>

<script>
    // programa olá mundo 1

    alert("Olá Mundo 1");

    // somar duas variáveis
    document.getElementById("somarBtn").addEventListener("click", function() {
    
    
    let numero1 = parseFloat(document.getElementById("numero1").value);
    let numero2 = parseFloat(document.getElementById("numero2").value);
    let soma = numero1 + numero2;
    let parImpar = ""; 
    
    if (soma % 2 === 0) {
    parImpar = "número par";
} else {
     parImpar = "número impar";
}


    document.getElementById("resultado").textContent = "A soma é do : " + soma + " e é um " + parImpar;
});



 //  Receba dois números e diga se ele maior



document.getElementById("verificar").addEventListener("click", function() {
    let num1 = Number(document.getElementById("num1").value);
let num2 = Number(document.getElementById("num2").value);
let restultadoMaior = document.getElementById("resultadoMaior");
console.log("Número 1:", num1);
console.log("Número 2:", num2);
if (num1 === num2) {
    restultadoMaior.textContent = "Os números são iguais.";
} else if (num1 > num2) {
    restultadoMaior.textContent = num1 + " é maior que " + num2;
} else {
    restultadoMaior.textContent = num2 + " é maior que " + num1;
}
});
