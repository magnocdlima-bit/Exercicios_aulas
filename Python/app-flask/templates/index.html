<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro de Alunos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="mb-2">
            Sistema de Alunos
        </h1>

        <p class="text-secondary">
            Aprendendo Flask + Python + Bootstrap
        </p>

        <hr>

        <h2 class="mt-4">
            Olá, {{ nome }}!
        </h2>

        <h3 class="mt-5">
            Alunos cadastrados
        </h3>

        <div class="row mt-3">

            {% for aluno in alunos %}

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5 class="card-title">
                                {{ aluno.nome }}
                            </h5>

                            <p class="card-text">
                                ID: {{ aluno.id }}
                            </p>

                            <p class="card-text">
                                Idade: {{ aluno.idade }} anos
                            </p>

                            <button class="btn btn-primary">
                                Ver aluno
                            </button>

                        </div>

                    </div>

                </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
